# Builds the library and runs its tests on every pull request and push to main. Read-only.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      # The repository ignores gradle-wrapper.jar, so use a pinned Gradle instead of ./gradlew.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.2.1'

      # Compile-only inputs, checked against the tested hashes; neither is bundled.
      - name: Fetch Iris and Sodium
        run: |
          mkdir -p "$RUNNER_TEMP/inputs" && cd "$RUNNER_TEMP/inputs"
          curl -fsSLo iris.jar 'https://cdn.modrinth.com/data/YL57xq9U/versions/KduFYu4t/iris-neoforge-1.8.14-beta.1%2Bmc1.21.1.jar'
          curl -fsSLo sodium.jar 'https://cdn.modrinth.com/data/AANobbMI/versions/iw5APcWy/sodium-neoforge-0.8.12-beta.1%2Bmc1.21.1.jar'
          sha256sum -c - <<'SUMS'
          60d5f8bf52f25e9986440f4a4270a6bd986d9cff994510e1108ac1547063b314  iris.jar
          dc2838d5538db39414171fe86586ab89d1a30d2fd97f59229cc44cf3777f569d  sodium.jar
          SUMS
          {
            echo "CHUNKS3_IRIS_JAR=$PWD/iris.jar"
            echo "CHUNKS3_SODIUM_JAR=$PWD/sodium.jar"
          } >> "$GITHUB_ENV"

      - name: Build and test
        env:
          LC_ALL: C.UTF-8
        run: gradle --no-daemon --console=plain build "-PbuildCommit=$(git rev-parse HEAD)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chunks3
          path: build/libs/
          if-no-files-found: error
          retention-days: 14
