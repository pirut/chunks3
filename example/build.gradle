// A tiny mod showing how to use Chunks3: one cubic dimension made by the library's Highlands test
// generator. Run it with ./gradlew :example:runClient, make a world and type /cubes enter.
plugins {
    id 'net.neoforged.moddev'
}

version = rootProject.mod_version
base { archivesName = 'chunks3example' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

dependencies {
    implementation project(':')
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [neo_version_range: neo_version_range, minecraft_version_range: minecraft_version_range,
                             loader_version_range: loader_version_range, mod_version: mod_version]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata

neoForge {
    version = rootProject.neo_version
    parchment {
        mappingsVersion = rootProject.parchment_mappings_version
        minecraftVersion = rootProject.parchment_minecraft_version
    }
    runs {
        client { client(); jvmArgument '-Xmx4G' }
        server { server(); programArgument '--nogui' }
    }
    mods {
        chunks3example { sourceSet(sourceSets.main) }
        chunks3 { sourceSet(project(':').sourceSets.main) }
    }
    ideSyncTask generateModMetadata
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
